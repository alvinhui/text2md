<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text2MD - 双向转换工具</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="/assets/css/index.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 class="title">Text2MD 双向转换工具</h1>
      <p class="subtitle">在富文本与 Markdown 之间快速转换，保持结构、表格与代码样式。</p>
    </header>

    <section class="cards">
      <a class="card" href="/rt2md">
        <span class="card-tag">入口 01</span>
        <h2 class="card-title">富文本 -> Markdown</h2>
        <p class="card-desc">适合将网页、文档、富文本编辑内容快速提取为可复制的 Markdown 源码。</p>
        <span class="card-action">进入工具</span>
      </a>

      <a class="card" href="/md2rt">
        <span class="card-tag">入口 02</span>
        <h2 class="card-title">Markdown -> 富文本</h2>
        <p class="card-desc">适合将 Markdown 实时渲染为可编辑富文本，支持表格与行内代码样式展示。</p>
        <span class="card-action">进入工具</span>
      </a>

      <a class="card" href="/wx2md">
        <span class="card-tag">入口 03</span>
        <h2 class="card-title">微信文章 -> Markdown</h2>
        <p class="card-desc">输入公众号文章链接，一键提取正文并转换为 Markdown，便于二次编辑与存档。</p>
        <span class="card-action">进入工具</span>
      </a>
    </section>

    <p class="foot">建议将此页作为产品 Landing，并通过顶部导航在两个工具间切换。</p>
  </main>
</body>
</html>
