<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>富文本 -> Markdown</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css"
  />
  <link rel="stylesheet" href="/assets/css/common.css" />
  <link rel="stylesheet" href="/assets/css/rt2md.css" />
</head>
<body>
  <main class="container">
    <h1>富文本与Markdown在线双向转换工具</h1>
    <div class="mode-switch">
      <a class="mode-btn active" href="/rt2md">富文本 -> Markdown</a>
      <a class="mode-btn" href="/md2rt">Markdown -> 富文本</a>
      <a class="mode-btn" href="/wx2md">微信文章 -> Markdown</a>
    </div>

    <section class="panels">
      <article class="panel">
        <header class="panel-header">
          <div class="panel-title">Rich Text Editor</div>
          <button id="copyRichBtn" class="btn" type="button">清空并复制文本</button>
        </header>
        <div class="editor-wrap">
          <div id="editor"></div>
        </div>
      </article>

      <article class="panel">
        <header class="panel-header">
          <div class="panel-title">Markdown Output</div>
          <button id="copyMarkdownBtn" class="btn" type="button">复制Markdown源码</button>
        </header>
        <div class="markdown-wrap">
          <textarea id="markdownOutput" spellcheck="false"></textarea>
        </div>
      </article>
    </section>
    <p class="tip">当前为富文本转 Markdown 页面，点击上方切换可跳到其他工具页面。</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.js"></script>
  <script src="/assets/js/rt2md.js"></script>
</body>
</html>
